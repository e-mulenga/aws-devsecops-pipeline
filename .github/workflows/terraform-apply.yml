# ============================================================
# GitHub Actions — Terraform Apply
# ============================================================
# Triggered on merge to main.
# DEV: auto-apply
# TEST: requires 1 reviewer approval (GitHub Environment rule)
# PROD: requires 2 reviewers + 15-min wait timer
#
# Scheduled drift detection runs Mon–Fri at 06:00 UTC.
#
# Auth: IAM user access keys stored in GitHub Secrets
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
# ============================================================

name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "buildspecs/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, test, prod]
      action:
        description: "Action"
        required: true
        type: choice
        options: [apply, plan-only]
        default: apply
  schedule:
    - cron: "0 6 * * 1-5"    # Drift detection Mon–Fri 06:00 UTC

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "af-south-1"

# FIX: added concurrency group — prevents two apply jobs running
# simultaneously against the same environment (state lock race).
concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-progress apply; queue instead

jobs:
  # ---- Deploy DEV (auto on merge) ---------------------------
  deploy-dev:
    name: Deploy → DEV
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (IAM user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="environments/dev/backend.tf" \
            -input=false \
            -reconfigure

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="environments/dev/terraform.tfvars" \
            -out=dev.tfplan \
            -input=false \
            -no-color

      # FIX: upload plan artifact so it can be inspected if apply fails
      - name: Upload DEV plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-tfplan-${{ github.sha }}
          path: dev.tfplan
          retention-days: 3

      - name: Terraform Apply
        if: github.event.inputs.action != 'plan-only'
        run: terraform apply -auto-approve -input=false dev.tfplan

      - name: Summary
        run: |
          echo "## ✅ DEV Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          terraform output -json 2>/dev/null \
            | jq -r 'to_entries[] | "- **\(.key)**: \(.value.value)"' \
            >> $GITHUB_STEP_SUMMARY || true

  # ---- Deploy TEST (requires 1 approval) --------------------
  deploy-test:
    name: Deploy → TEST
    runs-on: ubuntu-latest
    environment: test
    needs: deploy-dev
    if: |
      always() &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test'))

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (IAM user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="environments/test/backend.tf" \
            -input=false \
            -reconfigure

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="environments/test/terraform.tfvars" \
            -out=test.tfplan \
            -input=false \
            -no-color

      # FIX: upload plan artifact
      - name: Upload TEST plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-tfplan-${{ github.sha }}
          path: test.tfplan
          retention-days: 3

      - name: Terraform Apply
        if: github.event.inputs.action != 'plan-only'
        run: terraform apply -auto-approve -input=false test.tfplan

      - name: Summary
        run: |
          echo "## ✅ TEST Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ---- Deploy PROD (requires 2 approvals + wait) ------------
  deploy-prod:
    name: Deploy → PROD
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-test
    if: |
      always() &&
      (needs.deploy-test.result == 'success' || needs.deploy-test.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (IAM user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="environments/prod/backend.tf" \
            -input=false \
            -reconfigure

      # FIX: was planning twice — once with -detailed-exitcode (no output file)
      # then again with -out= to get the plan file. The second plan could differ
      # from the first if infra changed between the two runs.
      # Fix: single plan with both -out= and -detailed-exitcode together.
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
            -var-file="environments/prod/terraform.tfvars" \
            -out=prod.tfplan \
            -detailed-exitcode \
            -input=false \
            -no-color
          echo "exitcode=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Upload PROD plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan-${{ github.sha }}
          path: prod.tfplan
          retention-days: 5

      - name: Skip if no changes
        if: steps.plan.outputs.exitcode == '0'
        run: echo "No changes detected — skipping apply." >> $GITHUB_STEP_SUMMARY

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "## ❌ Terraform Plan Failed" >> $GITHUB_STEP_SUMMARY
          exit 1

      # FIX: apply uses the saved plan file from the single plan step above
      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == '2' && github.event.inputs.action != 'plan-only'
        run: terraform apply -auto-approve -input=false prod.tfplan

      - name: Summary
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "## ✅ PROD Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }} | **Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

  # ---- Drift Detection (scheduled Mon–Fri) ------------------
  drift-detection:
    name: Drift Detection — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      matrix:
        include:
          - environment: dev
            secret_suffix: DEV
          - environment: test
            secret_suffix: TEST
          - environment: prod
            secret_suffix: PROD
      fail-fast: false   # check all environments even if one drifts

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (IAM user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="environments/${{ matrix.environment }}/backend.tf" \
            -input=false \
            -reconfigure

      - name: Detect Drift
        id: drift
        run: |
          set +e
          terraform plan \
            -var-file="environments/${{ matrix.environment }}/terraform.tfvars" \
            -detailed-exitcode \
            -input=false \
            -no-color 2>&1 | tee drift-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: Alert on drift
        if: steps.drift.outputs.exitcode == '2'
        run: |
          echo "## ⚠️ DRIFT DETECTED in ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          cat drift-output.txt >> $GITHUB_STEP_SUMMARY
          exit 1
