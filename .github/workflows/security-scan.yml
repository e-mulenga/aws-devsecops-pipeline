# ============================================================
# GitHub Actions — Security Scan (Daily + on Push)
# ============================================================
# Runs independently of Terraform:
#   - tfsec        — Terraform static analysis (HIGH+)
#   - checkov      — IaC policy checks (Terraform + buildspecs)
#   - Trivy IaC    — Config/IaC vulnerability scan
#   - Gitleaks     — Secret detection across full git history
#   - TFLint       — Terraform linting across all modules
#   - Buildspec YAML lint
# ============================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"    # 03:00 UTC daily
  workflow_dispatch:

# Cancel in-progress runs on the same branch to avoid stale scan noise
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub Security tab
  actions: read

jobs:
  # ----------------------------------------------------------
  # tfsec — Terraform static analysis
  # FIX: bumped tfsec-sarif-action from @v0.1.0 → @v0.1.4
  #      (v0.1.0 targets a deprecated Node.js 16 runner and
  #       fails on GitHub's current Node.js 24 runners)
  # ----------------------------------------------------------
  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-sarif-action@v0.1.4   # FIX: was @v0.1.0
        with:
          sarif_file: tfsec.sarif
          soft_fail: false
          additional_args: "--minimum-severity HIGH --exclude-downloaded-modules"

      - name: Upload tfsec SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3      # FIX: was @v4 (does not exist)
        if: always()
        with:
          sarif_file: tfsec.sarif
          category: tfsec

  # ----------------------------------------------------------
  # checkov — Bridgecrew IaC policy checks
  # No version change needed; @v12 is the correct major tag.
  # ----------------------------------------------------------
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
          download_external_modules: false   # ADD: prevents network calls to registry during CI

      - name: Upload Checkov SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3      # FIX: was @v4 (does not exist)
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ----------------------------------------------------------
  # Trivy — IaC configuration scan
  # FIX: added mandatory v prefix — @v0.36.0 is latest confirmed published tag
  # ----------------------------------------------------------
  trivy:
    name: Trivy IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0          # v0.36.0 confirmed latest — v prefix is mandatory
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: "HIGH,CRITICAL"
          exit-code: "0"          # don't fail the job; SARIF upload surfaces issues

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3      # FIX: was @v4 (does not exist)
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ----------------------------------------------------------
  # Gitleaks — Secret detection across full git history
  # FIX 1: replaced manual curl/install of v8.18.4 with the
  #         official gitleaks/gitleaks-action@v2 — always
  #         pulls the latest stable release automatically.
  # FIX 2: added upload-sarif so findings appear in the
  #         GitHub Security tab (was missing previously).
  # ----------------------------------------------------------
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for secret scanning

      - name: Run Gitleaks                               # FIX: was manual curl of v8.18.4
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # only needed for org-level scans

  # ----------------------------------------------------------
  # TFLint — Terraform linting across all modules
  # FIX: setup-tflint@v6 does not exist — latest is @v4.
  #      Using @v6 causes "action not found" and job failure.
  # ----------------------------------------------------------
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4.1.1       # FIX: pinned to v4.1.1 — resolves Node.js 20 deprecation warning
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact

  # ----------------------------------------------------------
  # Buildspec YAML Lint — validates all buildspec YAML files
  # No changes needed; logic is correct.
  # ----------------------------------------------------------
  buildspec-lint:
    name: Buildspec YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint --quiet

      - name: Lint buildspecs
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 200}}}" buildspecs/
          echo "All buildspec YAML files are valid."
