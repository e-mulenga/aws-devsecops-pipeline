# ============================================================
# GitHub Actions — Security Scan (Daily + on Push)
# ============================================================
# Runs independently of Terraform:
#   - tfsec on all Terraform code
#   - checkov on all IaC (Terraform + buildspecs)
#   - trivy on IaC config files
#   - gitleaks on full git history
#   - TFLint on all modules
# ============================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"    # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents:        read
  security-events: write
  actions:         read

jobs:
  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-sarif-action@v0.1.0
        with:
          sarif_file: tfsec.sarif
          soft_fail: false
          additional_args: "--minimum-severity HIGH --exclude-downloaded-modules"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: tfsec.sarif, category: tfsec }

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: checkov.sarif, category: checkov }

  trivy:
    name: Trivy IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: "HIGH,CRITICAL"
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif, category: trivy }

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with: { tflint_version: latest }
      - name: Init TFLint
        run: tflint --init
      - name: Lint
        run: tflint --recursive --format compact

  buildspec-lint:
    name: Buildspec YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint --quiet
      - name: Lint buildspecs
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 200}}}" buildspecs/
          echo "All buildspec YAML files are valid."
