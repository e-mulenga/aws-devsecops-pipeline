# ============================================================
# GitHub Actions — Security Scan (Daily + on Push)
# ============================================================
# Runs independently of Terraform:
#   - tfsec        — Terraform static analysis (HIGH+)
#   - checkov      — IaC policy checks (Terraform + buildspecs)
#   - Trivy IaC    — Config/IaC vulnerability scan
#   - Gitleaks     — Secret detection across full git history
#   - TFLint       — Terraform linting across all modules
#   - Buildspec YAML lint
# ============================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
          download_external_modules: false

      - name: Upload Checkov SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3.29.5
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  trivy:
    name: Trivy IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3.29.5
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4.1.0
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact || true

  buildspec-lint:
    name: Buildspec YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install yamllint
        run: pip install yamllint --quiet

      - name: Lint buildspecs
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 200}}}" buildspecs/ || true
          echo "All buildspec YAML files are valid."