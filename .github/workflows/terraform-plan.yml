# ============================================================
# GitHub Actions — Terraform Plan (PR Gate)
# ============================================================
# Runs on every PR targeting main.
# Authenticates via OIDC (no long-lived AWS keys).
# Posts terraform plan output as a PR comment per environment.
# Runs tfsec + checkov + gitleaks as inline security gates.
#
# Required GitHub Environments (Settings → Environments):
#   dev-plan, test-plan, prod-plan
#   (no approval rules needed — these gate OIDC role assumption)
# ============================================================

name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "buildspecs/**"
      - ".github/workflows/terraform-*.yml"

# FIX: added concurrency group — cancels stale plan runs when
# a new commit is pushed to the same PR branch.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # safe to cancel plans (unlike applies)

permissions:
  id-token: write    # OIDC token exchange
  contents: read
  pull-requests: write    # post plan comments to PR
  security-events: write    # upload SARIF to GitHub Security tab

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "af-south-1"

jobs:
  # ---- Secret Detection (always first) ----------------------
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Security Scan ----------------------------------------
  security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      # FIX: bumped tfsec-sarif-action from @v0.1.0 → @v0.1.4
      # v0.1.0 targets the deprecated Node.js 16 runner and fails
      # on GitHub's current Node.js 24 runners.
      - name: Run tfsec
        uses: aquasecurity/tfsec-sarif-action@v0.1.4    # FIX: was @v0.1.0
        with:
          sarif_file: tfsec.sarif
          soft_fail: false
          additional_args: "--minimum-severity HIGH"

      # FIX: upload-sarif version corrected to @v3 (v4 does not exist)
      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v3       # FIX: was @v4
        if: always()
        with:
          sarif_file: tfsec.sarif
          category: tfsec

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
          download_external_modules: false

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3       # FIX: was @v4
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ---- Terraform Format & Validate --------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  # ---- Plan per environment ---------------------------------
  # NOTE: Requires GitHub Environments named "dev-plan",
  # "test-plan", and "prod-plan" to exist in your repo.
  # Settings → Environments → New environment
  # No approval rules needed — environments gate OIDC roles.
  plan:
    name: Plan — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: [security-scan, validate]
    environment: ${{ matrix.environment }}-plan

    strategy:
      fail-fast: false   # plan all environments even if one fails
      matrix:
        include:
          - environment: dev
            secret_suffix: DEV
          - environment: test
            secret_suffix: TEST
          - environment: prod
            secret_suffix: PROD

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_PLAN_ROLE_ARN_{0}', matrix.secret_suffix)] }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Plan-${{ matrix.environment }}-${{ github.run_id }}
          role-duration-seconds: 1800

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="environments/${{ matrix.environment }}/backend.tf" \
            -input=false \
            -reconfigure

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
            -var-file="environments/${{ matrix.environment }}/terraform.tfvars" \
            -out="plan-${{ matrix.environment }}.tfplan" \
            -input=false \
            -no-color 2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.environment }}-${{ github.sha }}
          path: plan-${{ matrix.environment }}.tfplan
          retention-days: 5

      # Post/update plan comment on the PR
      # Deletes previous comment for same environment before posting
      # to prevent comment thread bloat on multi-commit PRs.
      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('plan-output.txt', 'utf8');
            const truncated = output.length > 60000
              ? output.substring(0, 60000) + '\n\n... [truncated — see full output in Actions logs]'
              : output;
            const header = `Terraform Plan — \`${{ matrix.environment }}\``;
            const body = [
              `## ${header}`,
              '',
              '```hcl',
              truncated,
              '```',
              '',
              `> Commit \`${{ github.sha }}\` | Run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            // Delete previous comment for this environment to keep PR clean
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot' && c.body.includes(header)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # Exit code 0 = no changes, 2 = changes pending — both valid.
      # Exit code 1 = plan error — fail the job.
      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "## ❌ Terraform Plan Failed for ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          exit 1
