# ============================================================
# buildspec-sbom.yml — SBOM Generation
# ============================================================
# Tool: Syft — generates CycloneDX and SPDX SBOMs
# Outputs are stored in S3 artifact store for audit trail.
# ============================================================
version: 0.2
env:
  variables:
    SYFT_VERSION: "1.0.1"
phases:
  install:
    commands:
      - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v${SYFT_VERSION}
      - syft version
  pre_build:
    commands:
      - IMAGE_URI=$(cat imagedefinitions.json | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['imageUri'])")
      - ECR_REGISTRY=$(echo $IMAGE_URI | cut -d'/' -f1)
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  build:
    commands:
      - echo "=== Generating SBOM (CycloneDX) ==="
      - syft $IMAGE_URI -o cyclonedx-json > sbom-cyclonedx.json
      - echo "=== Generating SBOM (SPDX) ==="
      - syft $IMAGE_URI -o spdx-json > sbom-spdx.json
      - echo "=== Generating filesystem SBOM ==="
      - syft dir:. -o cyclonedx-json > sbom-source-cyclonedx.json
      - echo "SBOM generation complete."
      - python3 -c "import json; d=json.load(open('sbom-cyclonedx.json')); print(f'Components: {len(d.get(\"components\",[]))}')"
artifacts:
  files:
    - sbom-cyclonedx.json
    - sbom-spdx.json
    - sbom-source-cyclonedx.json
  name: SBOMResults
