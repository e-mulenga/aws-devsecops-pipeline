---
# ============================================================
# buildspec-secret-scan.yml — Stage 1: Secrets Detection
# ============================================================
# Tool: gitleaks v8
# Blocks pipeline on ANY detected secret (API key, password,
# private key, token, connection string).
# Findings uploaded to Security Hub as ASFF findings.
# ============================================================
version: 0.2
env:
  variables:
    GITLEAKS_VERSION: "8.18.4"
phases:
  install:
    commands:
      - echo "=== Installing gitleaks ==="
      - |
        curl -sSfL \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C /usr/local/bin gitleaks
      - gitleaks version
  build:
    commands:
      - echo "=== Running gitleaks secrets scan ==="
      - |
        gitleaks detect \
          --source . \
          --report-format sarif \
          --report-path gitleaks-report.sarif \
          --verbose \
          --exit-code 1 || SCAN_EXIT=$?
      - |
        if [ "${SCAN_EXIT:-0}" -ne 0 ]; then
          echo "CRITICAL: Secrets detected by gitleaks. Pipeline BLOCKED."
          cat gitleaks-report.sarif | python3 - <<'PY'
        import json, sys

        d = json.load(sys.stdin)
        runs = d.get('runs', [])
        for run in runs:
          for r in run.get('results', []):
            print(f"  SECRET FOUND: {r.get('message', {}).get('text', '')}")
        PY
          exit 1
        fi
      - echo "=== No secrets detected ==="
artifacts:
  files:
    - gitleaks-report.sarif
  name: SecretScanResults
