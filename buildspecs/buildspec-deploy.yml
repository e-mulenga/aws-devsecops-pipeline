# ============================================================
# buildspec-deploy.yml — Cross-Account Deployment
# ============================================================
# Used for deploy-dev, deploy-test, deploy-prod stages.
# DEPLOY_ACCOUNT_ID and DEPLOY_ENV set by CodeBuild project.
# Supports ECS (imagedefinitions.json) and EKS (kubectl).
# ============================================================
version: 0.2
env:
  variables:
    DEPLOY_ACCOUNT_ID: ""
    DEPLOY_ENV: ""
phases:
  pre_build:
    commands:
      - echo "=== Assuming cross-account deployment role ==="
      - |
        CREDS=$(aws sts assume-role \
          --role-arn "arn:aws:iam::${DEPLOY_ACCOUNT_ID}:role/${ORGANIZATION_NAME}-pipeline-deploy-role" \
          --role-session-name "Deploy-${DEPLOY_ENV}-${CODEBUILD_BUILD_ID}" \
          --query 'Credentials' --output json)
        export AWS_ACCESS_KEY_ID=$(echo $CREDS | python3 -c "import json,sys; print(json.load(sys.stdin)['AccessKeyId'])")
        export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | python3 -c "import json,sys; print(json.load(sys.stdin)['SecretAccessKey'])")
        export AWS_SESSION_TOKEN=$(echo $CREDS | python3 -c "import json,sys; print(json.load(sys.stdin)['SessionToken'])")
      - echo "=== Deploying to ${DEPLOY_ENV} (account: ${DEPLOY_ACCOUNT_ID}) ==="
  build:
    commands:
      - IMAGE_URI=$(cat imagedefinitions.json | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['imageUri'])")
      - echo "Deploying image: $IMAGE_URI"
      - |
        if command -v kubectl >/dev/null 2>&1; then
          aws eks update-kubeconfig \
            --name "${ORGANIZATION_NAME}-${DEPLOY_ENV}-cluster" \
            --region "${AWS_REGION}"
          kubectl set image deployment/app app=$IMAGE_URI -n "${DEPLOY_ENV}"
          kubectl rollout status deployment/app -n "${DEPLOY_ENV}" --timeout=300s
        else
          echo "kubectl not available — deploy via ECS or custom script"
          # ECS: aws ecs update-service --cluster <cluster> --service <svc> --force-new-deployment
        fi
  post_build:
    commands:
      - echo "=== Deployment to ${DEPLOY_ENV} complete ==="
      - echo "Image deployed: $IMAGE_URI"
      - echo "Account: ${DEPLOY_ACCOUNT_ID}"
      - echo "Timestamp: $(date -u)"
artifacts:
  files:
    - imagedefinitions.json
  name: DeployArtifact
